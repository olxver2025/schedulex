[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedulex"
version = "0.4.0"
description = "A local, subscription-aware task queue for Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schedulex = "schedulex.cli:main"
schx = "schedulex.cli:main"

[tool.setuptools.packages.find]
include = ["schedulex*"]
